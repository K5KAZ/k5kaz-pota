name: Update K5KAZ POTA data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  update-pota:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update POTA data
        run: python scripts/update-pota.py

      - name: Commit updated POTA data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/pota.json

          if git diff --cached --quiet; then
            echo "No POTA data changes."
          else
            git commit -m "Update K5KAZ POTA data"
            git push
          fi
