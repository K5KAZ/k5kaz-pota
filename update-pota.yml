name: Update K5KAZ POTA data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch POTA data
        run: python3 scripts/update-pota.py
      - name: Commit updated cache
        run: |
          git config user.name "K5KAZ POTA updater"
          git config user.email "actions@users.noreply.github.com"
          git add data/pota.json
          git diff --cached --quiet || git commit -m "Update POTA data"
          git push
